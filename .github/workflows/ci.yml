name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: "postgresql://user:password@localhost:5432/aura?schema=public"

jobs:
  api:
    name: API (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Lint
        run: pnpm --filter api exec eslint "{src,apps,libs,test}/**/*.ts"

      - name: Type check
        run: pnpm --filter api exec tsc --noEmit

      - name: Test
        run: pnpm --filter api test

      - name: Build
        run: pnpm --filter api build

  web:
    name: Web (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter web exec eslint .

      - name: Type check
        run: pnpm --filter web exec tsc --noEmit

      - name: Test
        run: pnpm --filter web test

      - name: Build
        run: pnpm --filter web build
